name: JPX Options Data Automator

on:
  schedule:
    # 毎日日本時間 20:13 (UTC 11:13) に自動実行
    - cron: '13 11 * * *'
  workflow_dispatch: # ボタンを押して手動実行も可能にする

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: コードのチェックアウト
      uses: actions/checkout@v4

    - name: Python環境のセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # 🔑 Google Cloud (BigQuery) への認証設定
    - name: Google Cloud Authenticate
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

    # 📦 バックエンド処理に必要な最小限のライブラリだけをインストール
    - name: 必要なライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas openpyxl numpy scipy pandas-gbq google-cloud-bigquery

    # 🚀 BigQuery書き込みスクリプトの実行
    - name: スクリプトの実行
      env:
        GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      run: python main.py